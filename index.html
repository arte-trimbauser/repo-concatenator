<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repo Concatenator</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1e1e1e;
      --border: #ccc;
      --input-bg: #fff;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --nav-link: #0366d6;
      --nav-active: #000;
      --status-color: green;
      --error-color: #d73a4a;
    }
    body.dark {
      --bg: #1e1e1e;
      --text: #e0e0e0;
      --border: #444;
      --input-bg: #2d2d2d;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --nav-link: #58a6ff;
      --nav-active: #fff;
      --status-color: #4caf50;
      --error-color: #f85149;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1000px; margin: 30px auto; padding: 0 20px; background-color: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    .nav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .nav a { text-decoration: none; color: var(--nav-link); font-weight: 600; }
    .nav a.active { color: var(--nav-active); border-bottom: 3px solid var(--nav-link); padding-bottom: 8px; }
    .theme-toggle { position: fixed; top: 20px; right: 20px; background: var(--border); border: none; border-radius: 30px; padding: 8px 16px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text); transition: background 0.3s; z-index: 1000; }
    .theme-toggle:hover { background: var(--nav-link); color: #fff; }
    textarea { width: 100%; height: 400px; margin-top: 10px; background-color: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: monospace; box-sizing: border-box; }
    input[type="text"] { width: 100%; padding: 10px; background-color: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    button { padding: 10px 20px; cursor: pointer; background-color: var(--btn-bg); color: #fff; border: none; border-radius: 6px; font-size: 1rem; transition: background 0.3s; margin-right: 10px; }
    button:hover { background-color: var(--btn-hover); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    #status { margin-top: 10px; font-weight: bold; }
    .error { color: var(--error-color); }
    .success { color: var(--status-color); }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid var(--border); border-top-color: var(--btn-bg); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <div class="nav">
    <a href="/index.html" class="active">📥 Download (Concatenar)</a>
    <a href="/upload.html">🤖 AI Proposta</a>
  </div>
  <h1>Cole o link do repositório GitHub</h1>
  <input type="text" id="repoUrl" placeholder="https://github.com/usuario/repo/tree/main">
  <br><br>
  <button id="fetchBtn" onclick="fetchRepo()">📂 Listar arquivos</button>
  <div id="status"></div>
  <textarea id="output" placeholder="A lista de arquivos aparecerá aqui..."></textarea>
  <br>
  <div class="btn-group">
    <button onclick="copyAll()">📋 Copiar tudo</button>
    <button onclick="downloadProject()" id="downloadBtn">📥 Baixar projeto (concatenado)</button>
  </div>

  <script>
    (function() {
      const toggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('theme') || 'light';
      document.body.classList.toggle('dark', currentTheme === 'dark');
      toggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', function() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        toggle.textContent = isDark ? '☀️' : '🌙';
      });
    })();

    async function fetchRepo() {
      const urlInput = document.getElementById('repoUrl').value.trim();
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      const btn = document.getElementById('fetchBtn');

      if (!urlInput) { status.innerHTML = '<span class="error">⚠️ Insira uma URL.</span>'; return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> A listar...';
      status.textContent = 'A obter lista de arquivos...';
      output.value = '';

      try {
        const response = await fetch('/api/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoUrl: urlInput })
        });
        if (!response.ok) throw new Error(`Erro ${response.status}`);
        const data = await response.json();
        if (data.files && data.files.length) {
          output.value = data.files.join('\n');
          status.innerHTML = `<span class="success">✅ ${data.total} arquivos encontrados.</span>`;
        } else {
          status.innerHTML = '<span class="error">Nenhum arquivo encontrado.</span>';
        }
      } catch (err) {
        status.innerHTML = `<span class="error">❌ Erro: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '📂 Listar arquivos';
      }
    }

    async function downloadProject() {
      const urlInput = document.getElementById('repoUrl').value.trim();
      if (!urlInput) {
        document.getElementById('status').innerHTML = '<span class="error">⚠️ Insira uma URL primeiro.</span>';
        return;
      }
      const status = document.getElementById('status');
      status.innerHTML = '⏳ A preparar o download...';
      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoUrl: urlInput })
        });
        if (!response.ok) throw new Error(`Erro ${response.status}`);
        const blob = await response.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        const match = urlInput.match(/github\.com\/([^\/]+)\/([^\/]+)/);
        const repoName = match ? match[2] : 'projeto';
        link.download = `${repoName}-concatenado.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
        status.innerHTML = '<span class="success">✅ Download iniciado!</span>';
      } catch (err) {
        status.innerHTML = `<span class="error">❌ Erro no download: ${err.message}</span>`;
      }
    }

    function copyAll() {
      const output = document.getElementById('output');
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
      const status = document.getElementById('status');
      status.innerHTML = '<span class="success">✅ Copiado para a área de transferência!</span>';
    }
  </script>
</body>
</html>
