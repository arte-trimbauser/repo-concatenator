<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Repo Concatenator</title>
  <style>
    /* ===== RESET E VARIÁVEIS ===== */
    * { box-sizing: border-box; }
    :root {
      --bg: #fafafa;
      --text: #1e1e1e;
      --border: #ccc;
      --input-bg: #fff;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --nav-link: #0366d6;
      --nav-active: #000;
      --status-color: #2ea44f;
      --error-color: #d73a4a;
      --focus-ring: 0 0 0 3px rgba(3, 102, 214, 0.4);
    }
    body.dark {
      --bg: #1e1e1e;
      --text: #e0e0e0;
      --border: #444;
      --input-bg: #2d2d2d;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --nav-link: #58a6ff;
      --nav-active: #fff;
      --status-color: #4caf50;
      --error-color: #f85149;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      line-height: 1.5;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .nav a {
      text-decoration: none;
      color: var(--nav-link);
      font-weight: 600;
      padding: 4px 0;
    }
    .nav a.active {
      color: var(--nav-active);
      border-bottom: 3px solid var(--nav-link);
      padding-bottom: 8px;
    }
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--border);
      border: none;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      transition: background 0.3s;
      z-index: 1000;
      background-color: var(--input-bg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .theme-toggle:hover {
      background: var(--nav-link);
      color: #fff;
    }
    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .form-group label {
      font-weight: 600;
      min-width: 80px;
    }
    .form-group input[type="text"],
    .form-group input[type="password"] {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      box-shadow: var(--focus-ring);
      border-color: var(--nav-link);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 10px;
    }
    .form-row .field {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .field input {
      padding: 8px 10px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .field input:focus {
      outline: none;
      box-shadow: var(--focus-ring);
      border-color: var(--nav-link);
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: var(--btn-bg);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.2s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover:not(:disabled) {
      background-color: var(--btn-hover);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.secondary {
      background-color: var(--border);
      color: var(--text);
    }
    button.secondary:hover:not(:disabled) {
      background-color: #b0b0b0;
    }
    button.danger {
      background-color: #d73a4a;
    }
    button.danger:hover:not(:disabled) {
      background-color: #b12a3a;
    }
    #cancelBtn {
      display: none;
      background-color: #d73a4a;
    }
    #cancelBtn:hover:not(:disabled) {
      background-color: #b12a3a;
    }
    #status {
      margin: 10px 0;
      font-weight: 600;
      min-height: 1.8em;
    }
    .error { color: var(--error-color); }
    .success { color: var(--status-color); }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid var(--border);
      border-top-color: var(--btn-bg);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #progressWrapper {
      margin: 10px 0;
      display: none;
    }
    #progressBar {
      width: 100%;
      height: 20px;
      border-radius: 10px;
      background: var(--border);
      overflow: hidden;
    }
    #progressBar::-webkit-progress-bar {
      background: var(--border);
      border-radius: 10px;
    }
    #progressBar::-webkit-progress-value {
      background: var(--btn-bg);
      border-radius: 10px;
      transition: width 0.3s;
    }
    #progressBar::-moz-progress-bar {
      background: var(--btn-bg);
      border-radius: 10px;
    }
    #progressPercent {
      font-weight: 600;
      margin-left: 10px;
    }

    #progressContainer {
      margin: 15px 0;
      padding: 10px 15px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    #progressContainer h4 {
      margin: 0 0 8px 0;
      font-weight: 600;
    }
    #progressList {
      list-style: none;
      padding: 0;
      margin: 0;
      font-family: monospace;
      font-size: 0.9rem;
    }
    #progressList li {
      padding: 2px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #progressList li .check {
      color: var(--status-color);
      font-weight: bold;
    }
    #progressList li .error {
      color: var(--error-color);
      font-weight: bold;
    }

    #fileTree {
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    #fileTree ul {
      list-style: none;
      padding-left: 20px;
      margin: 4px 0;
    }
    #fileTree li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
    }
    #fileTree input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--btn-bg);
    }
    #fileTree .folder {
      font-weight: 600;
      color: var(--nav-link);
    }
    #fileTree .file {
      color: var(--text);
    }
    .tree-actions {
      display: flex;
      gap: 10px;
      margin: 6px 0 10px 0;
    }
    .tree-actions button {
      padding: 4px 12px;
      font-size: 0.85rem;
      background: var(--border);
      color: var(--text);
    }
    .tree-actions button:hover:not(:disabled) {
      background: #b0b0b0;
    }

    textarea {
      width: 100%;
      height: 400px;
      margin-top: 10px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      box-sizing: border-box;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      box-shadow: var(--focus-ring);
      border-color: var(--nav-link);
    }

    input[list]::-webkit-calendar-picker-indicator {
      opacity: 0.6;
    }

    @media (max-width: 700px) {
      .form-group { flex-direction: column; align-items: stretch; }
      .form-group label { min-width: auto; }
      .form-row .field { flex: 1 1 100%; }
      .btn-group button { flex: 1; }
      #fileTree { max-height: 200px; }
      #progressContainer { max-height: 200px; }
    }
    @media (max-width: 500px) {
      .theme-toggle { top: 10px; right: 10px; padding: 4px 12px; font-size: 1rem; }
      body { padding: 0 10px; margin: 15px auto; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">🌙</button>

  <div class="nav">
    <a href="/index.html" class="active">📥 Download (Concatenar)</a>
    <a href="/upload.html">🤖 AI Proposta</a>
  </div>

  <h1>Cole o link do repositório GitHub</h1>

  <div class="form-group">
    <label for="repoUrl">URL:</label>
    <input type="text" id="repoUrl" list="historyList" placeholder="https://github.com/usuario/repo" />
    <datalist id="historyList"></datalist>
  </div>

  <div class="form-row">
    <div class="field">
      <label for="branch">Branch</label>
      <input type="text" id="branch" placeholder="main" value="main" />
    </div>
    <div class="field">
      <label for="extensions">Extensões (ex: .js,.css)</label>
      <input type="text" id="extensions" placeholder=".js,.ts,.html,.css" />
    </div>
    <div class="field">
      <label for="token">Token (opcional)</label>
      <input type="password" id="token" placeholder="github_pat_xxx" />
    </div>
  </div>

  <div class="btn-group">
    <button id="fetchBtn" onclick="fetchRepo()">📂 Listar arquivos</button>
    <button id="fullContentBtn" onclick="fetchFullContent()">📄 Ver código completo</button>
    <button id="downloadBtn" onclick="downloadProject()">📥 Baixar projeto</button>
    <button class="secondary" onclick="clearAll()">🗑️ Limpar</button>
    <button id="cancelBtn" onclick="cancelOperation()">⛔ Cancelar</button>
  </div>

  <div id="status"></div>

  <div id="progressWrapper">
    <progress id="progressBar" value="0" max="100"></progress>
    <span id="progressPercent">0%</span>
  </div>

  <div id="progressContainer">
    <h4>📋 Progresso do processamento</h4>
    <ul id="progressList"></ul>
  </div>

  <div id="fileTreeContainer" style="display:none;">
    <div class="tree-actions">
      <button onclick="selectAllFiles(true)">✅ Selecionar todos</button>
      <button onclick="selectAllFiles(false)">❌ Limpar seleção</button>
      <span id="fileCount" style="margin-left:auto;font-weight:600;"></span>
    </div>
    <div id="fileTree"></div>
  </div>

  <textarea id="output" placeholder="Os códigos aparecerão aqui..."></textarea>
  <div class="btn-group">
    <button onclick="copyAll()">📋 Copiar tudo</button>
  </div>

  <script>
    (function() {
      // Tema
      const toggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('theme') || 'light';
      document.body.classList.toggle('dark', currentTheme === 'dark');
      toggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', function() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        toggle.textContent = isDark ? '☀️' : '🌙';
      });

      // Histórico
      function loadHistory() {
        try {
          const h = JSON.parse(localStorage.getItem('repoHistory') || '[]');
          return Array.isArray(h) ? h : [];
        } catch { return []; }
      }
      function saveHistory(url) {
        let hist = loadHistory();
        hist = hist.filter(u => u !== url);
        hist.unshift(url);
        if (hist.length > 5) hist.pop();
        localStorage.setItem('repoHistory', JSON.stringify(hist));
        updateDatalist(hist);
      }
      function updateDatalist(hist) {
        const datalist = document.getElementById('historyList');
        datalist.innerHTML = hist.map(u => `<option value="${u}">`).join('');
      }
      updateDatalist(loadHistory());

      // Cache
      function getCacheKey(owner, repo, branch, extensions) {
        return `repo_cache_${owner}_${repo}_${branch}_${extensions.sort().join(',')}`;
      }
      function getCached(key) {
        try {
          const item = localStorage.getItem(key);
          if (!item) return null;
          const { data, timestamp } = JSON.parse(item);
          if (Date.now() - timestamp > 5 * 60 * 1000) {
            localStorage.removeItem(key);
            return null;
          }
          return data;
        } catch { return null; }
      }
      function setCached(key, data) {
        localStorage.setItem(key, JSON.stringify({ data, timestamp: Date.now() }));
      }

      // Utilitários
      function parseGitHubUrl(url) {
        const match = url.match(/github\.com\/([^\/]+)\/([^\/]+)(?:\/tree\/([^\/]+))?(?:\/(.*))?/);
        if (!match) throw new Error('URL inválida. Use o formato: https://github.com/usuario/repo');
        return {
          owner: match[1],
          repo: match[2],
          branch: match[3] || 'main',
          path: match[4] || ''
        };
      }

      function setStatus(msg, type = 'info') {
        const el = document.getElementById('status');
        el.className = type;
        el.innerHTML = msg;
      }
      function setLoading(btnId, loadingText) {
        const btn = document.getElementById(btnId);
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> ${loadingText}`;
        return btn;
      }
      function resetButton(btnId, originalText) {
        const btn = document.getElementById(btnId);
        btn.disabled = false;
        btn.innerHTML = originalText;
      }

      // AbortController
      let currentController = null;
      let isCancelled = false;

      function showCancelButton() {
        document.getElementById('cancelBtn').style.display = 'inline-flex';
      }
      function hideCancelButton() {
        document.getElementById('cancelBtn').style.display = 'none';
      }
      window.cancelOperation = function() {
        if (currentController) {
          currentController.abort();
          isCancelled = true;
          setStatus('⛔ Operação cancelada pelo utilizador.', 'error');
        }
      };

      // Progresso
      function showProgress() {
        document.getElementById('progressWrapper').style.display = 'block';
        document.getElementById('progressContainer').style.display = 'block';
        document.getElementById('progressList').innerHTML = '';
        document.getElementById('progressBar').value = 0;
        document.getElementById('progressPercent').textContent = '0%';
      }
      function updateProgress(current, total) {
        const pct = total > 0 ? Math.round((current / total) * 100) : 0;
        document.getElementById('progressBar').value = pct;
        document.getElementById('progressPercent').textContent = pct + '%';
      }
      function addProgressItem(filePath, status = 'success', errorMsg = '') {
        const list = document.getElementById('progressList');
        const li = document.createElement('li');
        if (status === 'success') {
          li.innerHTML = `<span class="check">✔️</span> ${filePath}`;
        } else {
          li.style.color = 'var(--error-color)';
          li.innerHTML = `<span class="error">❌</span> ${filePath} — ${errorMsg}`;
        }
        list.appendChild(li);
        const container = document.getElementById('progressContainer');
        container.scrollTop = container.scrollHeight;
      }
      function hideProgress() {
        document.getElementById('progressWrapper').style.display = 'none';
        document.getElementById('progressContainer').style.display = 'none';
        hideCancelButton();
      }

      let currentFiles = [];

      // Listar via backend
      window.fetchRepo = async function() {
        const urlInput = document.getElementById('repoUrl').value.trim();
        if (!urlInput) { setStatus('⚠️ Insira uma URL.', 'error'); return; }

        let parsed;
        try { parsed = parseGitHubUrl(urlInput); }
        catch (e) { setStatus(`❌ ${e.message}`, 'error'); return; }

        const branch = document.getElementById('branch').value.trim() || 'main';
        const extensionsRaw = document.getElementById('extensions').value.trim();
        const extensions = extensionsRaw ? extensionsRaw.split(',').map(e => e.trim()).filter(Boolean) : [];
        const token = document.getElementById('token').value.trim();

        saveHistory(urlInput);

        const cacheKey = getCacheKey(parsed.owner, parsed.repo, branch, extensions);
        const cached = getCached(cacheKey);
        if (cached) {
          currentFiles = cached;
          renderFileTree(currentFiles);
          setStatus(`✅ ${currentFiles.length} arquivos encontrados (cache).`, 'success');
          document.getElementById('fileTreeContainer').style.display = 'block';
          return;
        }

        const btn = setLoading('fetchBtn', 'A listar...');
        setStatus('⏳ Obtendo lista de arquivos...', 'info');

        try {
          const response = await fetch('/api/list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repoUrl: urlInput, branch, extensions, token })
          });
          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || `Erro ${response.status}`);
          }
          const data = await response.json();
          currentFiles = data.files || [];
          setCached(cacheKey, currentFiles);
          renderFileTree(currentFiles);
          document.getElementById('fileTreeContainer').style.display = 'block';
          setStatus(`✅ ${currentFiles.length} arquivos encontrados.`, 'success');
        } catch (err) {
          if (err.name === 'AbortError') {
            setStatus('⛔ Operação cancelada.', 'error');
          } else {
            setStatus(`❌ Erro: ${err.message}`, 'error');
          }
        } finally {
          resetButton('fetchBtn', '📂 Listar arquivos');
        }
      };

      function renderFileTree(files) {
        const container = document.getElementById('fileTree');
        container.innerHTML = '';
        if (!files || files.length === 0) {
          container.innerHTML = '<em>Nenhum arquivo encontrado.</em>';
          document.getElementById('fileCount').textContent = '0 arquivos';
          return;
        }

        const tree = {};
        files.forEach(file => {
          const parts = file.path.split('/');
          let current = tree;
          for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            if (i === parts.length - 1) {
              if (!current._files) current._files = [];
              current._files.push({ name: part, path: file.path, sha: file.sha, size: file.size });
            } else {
              if (!current[part]) current[part] = {};
              current = current[part];
            }
          }
        });

        function buildTree(node, pathPrefix = '') {
          const ul = document.createElement('ul');
          const keys = Object.keys(node).filter(k => k !== '_files');
          keys.sort();
          for (const key of keys) {
            const li = document.createElement('li');
            const folderSpan = document.createElement('span');
            folderSpan.className = 'folder';
            folderSpan.textContent = '📁 ' + key;
            li.appendChild(folderSpan);
            const childUl = buildTree(node[key], pathPrefix + key + '/');
            li.appendChild(childUl);
            ul.appendChild(li);
          }
          if (node._files) {
            node._files.sort((a, b) => a.name.localeCompare(b.name));
            for (const file of node._files) {
              const li = document.createElement('li');
              const cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.dataset.path = file.path;
              cb.className = 'file-checkbox';
              cb.checked = true;
              li.appendChild(cb);
              const fileSpan = document.createElement('span');
              fileSpan.className = 'file';
              fileSpan.textContent = '📄 ' + file.name;
              li.appendChild(fileSpan);
              ul.appendChild(li);
            }
          }
          return ul;
        }

        const rootUl = buildTree(tree);
        container.appendChild(rootUl);

        const allCheckboxes = container.querySelectorAll('.file-checkbox');
        document.getElementById('fileCount').textContent = `${allCheckboxes.length} arquivos`;

        container.addEventListener('change', updateFileCount);
        updateFileCount();
      }

      function updateFileCount() {
        const checkboxes = document.querySelectorAll('.file-checkbox');
        const checked = document.querySelectorAll('.file-checkbox:checked');
        document.getElementById('fileCount').textContent = `${checked.length} / ${checkboxes.length} arquivos selecionados`;
      }

      window.selectAllFiles = function(select) {
        document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = select);
        updateFileCount();
      };

      function getSelectedPaths() {
        const checkboxes = document.querySelectorAll('.file-checkbox:checked');
        return Array.from(checkboxes).map(cb => cb.dataset.path);
      }

      // ===== FUNÇÃO CORRIGIDA: getFileContentViaBackend =====
      async function getFileContentViaBackend(owner, repo, branch, path, token, signal) {
        // Se signal for fornecido, usa-o; caso contrário, faz fetch sem signal
        const fetchOptions = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ owner, repo, branch, path, token })
        };
        if (signal) {
          fetchOptions.signal = signal;
        }
        const response = await fetch('/api/get-content', fetchOptions);
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || `HTTP ${response.status}`);
        }
        const data = await response.json();
        return data.content;
      }

      // ===== fetchFullContent (corrigido) =====
      window.fetchFullContent = async function() {
        const urlInput = document.getElementById('repoUrl').value.trim();
        if (!urlInput) { setStatus('⚠️ Insira uma URL.', 'error'); return; }
        let parsed;
        try { parsed = parseGitHubUrl(urlInput); }
        catch (e) { setStatus(`❌ ${e.message}`, 'error'); return; }

        if (currentFiles.length === 0) {
          await window.fetchRepo();
          if (currentFiles.length === 0) {
            setStatus('❌ Nenhum arquivo disponível.', 'error');
            return;
          }
        }

        const selected = getSelectedPaths();
        if (selected.length === 0) {
          setStatus('⚠️ Selecione pelo menos um arquivo.', 'error');
          return;
        }

        const branch = document.getElementById('branch').value.trim() || 'main';
        const token = document.getElementById('token').value.trim();
        const btn = setLoading('fullContentBtn', 'A carregar...');
        setStatus(`⏳ Carregando ${selected.length} arquivos...`, 'info');
        const output = document.getElementById('output');
        output.value = '';

        // Criar novo AbortController
        if (currentController) {
          currentController.abort();
        }
        currentController = new AbortController();
        isCancelled = false;
        showCancelButton();

        showProgress();
        let fullContent = '';
        let loaded = 0, errors = 0;

        for (const path of selected) {
          if (isCancelled) break;
          try {
            const content = await getFileContentViaBackend(
              parsed.owner, parsed.repo, branch, path, token, currentController.signal
            );
            fullContent += `===== ${path} =====\n${content}\n\n`;
            addProgressItem(path, 'success');
          } catch (err) {
            if (err.name === 'AbortError') {
              setStatus('⛔ Operação cancelada.', 'error');
              break;
            }
            errors++;
            const msg = err.message || 'Erro desconhecido';
            addProgressItem(path, 'error', msg);
            fullContent += `===== ${path} =====\n[ERRO] ${msg}\n\n`;
          }
          loaded++;
          updateProgress(loaded, selected.length);
          setStatus(`⏳ Processando ${loaded}/${selected.length} (${errors} erros)`, 'info');
        }

        if (!isCancelled) {
          output.value = fullContent;
          setStatus(`✅ ${selected.length} arquivos processados (${errors} falhas).`, errors > 0 ? 'error' : 'success');
        }
        resetButton('fullContentBtn', '📄 Ver código completo');
        hideCancelButton();
        currentController = null;
      };

      // ===== downloadProject (corrigido) =====
      window.downloadProject = async function() {
        const urlInput = document.getElementById('repoUrl').value.trim();
        if (!urlInput) { setStatus('⚠️ Insira uma URL.', 'error'); return; }
        let parsed;
        try { parsed = parseGitHubUrl(urlInput); }
        catch (e) { setStatus(`❌ ${e.message}`, 'error'); return; }

        if (currentFiles.length === 0) {
          await window.fetchRepo();
          if (currentFiles.length === 0) {
            setStatus('❌ Nenhum arquivo disponível.', 'error');
            return;
          }
        }

        const selected = getSelectedPaths();
        if (selected.length === 0) {
          setStatus('⚠️ Selecione pelo menos um arquivo.', 'error');
          return;
        }

        const branch = document.getElementById('branch').value.trim() || 'main';
        const token = document.getElementById('token').value.trim();
        const btn = setLoading('downloadBtn', 'A preparar...');
        setStatus(`⏳ Preparando download de ${selected.length} arquivos...`, 'info');

        if (currentController) {
          currentController.abort();
        }
        currentController = new AbortController();
        isCancelled = false;
        showCancelButton();

        showProgress();
        let fullText = '';
        let loaded = 0, errors = 0;

        for (const path of selected) {
          if (isCancelled) break;
          try {
            const content = await getFileContentViaBackend(
              parsed.owner, parsed.repo, branch, path, token, currentController.signal
            );
            fullText += `===== ${path} =====\n${content}\n\n`;
            addProgressItem(path, 'success');
          } catch (err) {
            if (err.name === 'AbortError') {
              setStatus('⛔ Operação cancelada.', 'error');
              break;
            }
            errors++;
            const msg = err.message || 'Erro desconhecido';
            addProgressItem(path, 'error', msg);
            fullText += `===== ${path} =====\n[ERRO] ${msg}\n\n`;
          }
          loaded++;
          updateProgress(loaded, selected.length);
          setStatus(`⏳ Processando ${loaded}/${selected.length} (${errors} erros)`, 'info');
        }

        if (!isCancelled && fullText) {
          const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          const repoName = parsed.repo;
          link.download = `${repoName}-concatenado.txt`;
          link.click();
          URL.revokeObjectURL(link.href);
          setStatus(`✅ Download iniciado! (${selected.length} arquivos, ${errors} falhas)`, errors > 0 ? 'error' : 'success');
        } else if (isCancelled) {
          setStatus('⛔ Download cancelado.', 'error');
        }
        resetButton('downloadBtn', '📥 Baixar projeto');
        hideCancelButton();
        currentController = null;
      };

      window.clearAll = function() {
        document.getElementById('output').value = '';
        setStatus('🧹 Limpo.', 'info');
        hideProgress();
        if (currentController) {
          currentController.abort();
          currentController = null;
        }
        hideCancelButton();
      };

      window.copyAll = function() {
        const output = document.getElementById('output');
        if (!output.value) { setStatus('⚠️ Nada para copiar.', 'error'); return; }
        output.select();
        navigator.clipboard.writeText(output.value).then(() => {
          setStatus('✅ Copiado para a área de transferência!', 'success');
        }).catch(() => {
          document.execCommand('copy');
          setStatus('✅ Copiado!', 'success');
        });
      };
    })();
  </script>
</body>
</html>
