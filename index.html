<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repo Concatenator</title>
  <style>
    /* ===== VARIÁVEIS ===== */
    :root {
      --bg: #fafafa;
      --text: #1e1e1e;
      --border: #ccc;
      --input-bg: #fff;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --nav-link: #0366d6;
      --nav-active: #000;
      --status-color: green;
      --error-color: #d73a4a;
    }
    body.dark {
      --bg: #1e1e1e;
      --text: #e0e0e0;
      --border: #444;
      --input-bg: #2d2d2d;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --nav-link: #58a6ff;
      --nav-active: #fff;
      --status-color: #4caf50;
      --error-color: #f85149;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
    }
    /* ===== NAVEGAÇÃO ===== */
    .nav {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .nav a {
      text-decoration: none;
      color: var(--nav-link);
      font-weight: 600;
    }
    .nav a.active {
      color: var(--nav-active);
      border-bottom: 3px solid var(--nav-link);
      padding-bottom: 8px;
    }
    /* ===== TOGGLE ===== */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--border);
      border: none;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      transition: background 0.3s;
      z-index: 1000;
    }
    .theme-toggle:hover {
      background: var(--nav-link);
      color: #fff;
    }
    textarea {
      width: 100%;
      height: 400px;
      margin-top: 10px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      box-sizing: border-box;
      transition: background 0.3s, color 0.3s;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: var(--btn-bg);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.3s;
    }
    button:hover {
      background-color: var(--btn-hover);
    }
    #status {
      margin-top: 10px;
      color: var(--status-color);
      font-weight: bold;
    }
    .error {
      color: var(--error-color);
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>

  <div class="nav">
    <a href="/index.html" class="active">📥 Download (Concatenar)</a>
    <a href="/upload.html">📤 Upload (Atualizar Repo)</a>
  </div>

  <h1>Cole o link do repositório GitHub</h1>
  <input type="text" id="repoUrl" placeholder="https://github.com/usuario/repo/tree/main">
  <br><br>
  <button onclick="fetchRepo()">Buscar códigos</button>
  <div id="status"></div>
  <textarea id="output" placeholder="Os códigos aparecerão aqui..."></textarea>
  <br><br>
  <button onclick="copyAll()">Copiar tudo</button>

  <script src="script.js"></script>
  <script>
    (function() {
      const toggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('theme') || 'light';
      document.body.classList.toggle('dark', currentTheme === 'dark');
      toggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

      toggle.addEventListener('click', function() {
        const isDark = document.body.classList.toggle('dark');
        const newTheme = isDark ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        toggle.textContent = isDark ? '☀️' : '🌙';
      });
    })();

    function copyAll() {
      const output = document.getElementById('output');
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
      const status = document.getElementById('status');
      status.innerHTML = '<span style="color:var(--status-color)">✅ Conteúdo copiado para a área de transferência!</span>';
    }
  </script>

</body>
</html>
