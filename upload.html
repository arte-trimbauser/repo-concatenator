<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repo AI - Proposta e Aplicação</title>
  <!-- CDN para renderizar diffs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css">
  <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html-ui.min.js"></script>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1e1e1e;
      --border: #ccc;
      --input-bg: #fff;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --btn-danger: #d73a4a;
      --btn-danger-hover: #b31d28;
      --btn-secondary: #586069;
      --btn-secondary-hover: #444d56;
      --nav-link: #0366d6;
      --nav-active: #000;
      --status-color: #22863a;
      --error-color: #d73a4a;
      --info-bg: #e1f0fa;
      --info-border: #0366d6;
      --details-bg: #f6f8fa;
      --ai-bg: #e8f0fe;
      --ai-border: #1a73e8;
      --warning-bg: #fff5b1;
      --warning-border: #ffd700;
    }
    body.dark {
      --bg: #1e1e1e;
      --text: #e0e0e0;
      --border: #444;
      --input-bg: #2d2d2d;
      --btn-bg: #2ea44f;
      --btn-hover: #22863a;
      --btn-danger: #f85149;
      --btn-danger-hover: #da3633;
      --btn-secondary: #8b949e;
      --btn-secondary-hover: #b1bac4;
      --nav-link: #58a6ff;
      --nav-active: #fff;
      --status-color: #4caf50;
      --error-color: #f85149;
      --info-bg: #1e2a3a;
      --info-border: #58a6ff;
      --details-bg: #2d2d2d;
      --ai-bg: #1e2a3a;
      --ai-border: #58a6ff;
      --warning-bg: #3d3a1a;
      --warning-border: #ffd700;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
    }
    .nav {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .nav a {
      text-decoration: none;
      color: var(--nav-link);
      font-weight: 600;
    }
    .nav a.active {
      color: var(--nav-active);
      border-bottom: 3px solid var(--nav-link);
      padding-bottom: 8px;
    }
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--border);
      border: none;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      transition: background 0.3s;
      z-index: 1000;
    }
    .theme-toggle:hover {
      background: var(--nav-link);
      color: #fff;
    }
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
      transition: background 0.3s, color 0.3s;
    }
    textarea {
      height: 200px;
      font-family: monospace;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: var(--btn-bg);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.3s;
    }
    button:hover { background-color: var(--btn-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-danger { background-color: var(--btn-danger); }
    .btn-danger:hover { background-color: var(--btn-danger-hover); }
    .btn-secondary { background-color: var(--btn-secondary); }
    .btn-secondary:hover { background-color: var(--btn-secondary-hover); }

    .form-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .form-group .field {
      flex: 1;
      min-width: 150px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .ai-container {
      background: var(--ai-bg);
      border: 1px solid var(--ai-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .ai-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .ai-row input { flex: 2; min-width: 200px; }
    .ai-row button { flex: 0; background: #1a73e8; }
    .ai-row button:hover { background: #1557b0; }

    .proposal-area {
      margin-top: 20px;
      border: 2px solid var(--ai-border);
      border-radius: 8px;
      padding: 20px;
      background: var(--input-bg);
      display: none;
    }
    .proposal-area.visible { display: block; }

    .diff-container {
      background: var(--details-bg);
      border-radius: 6px;
      padding: 10px;
      margin: 10px 0;
      max-height: 500px;
      overflow-y: auto;
    }
    .diff-container .d2h-wrapper { font-size: 0.85rem; }

    .safety-issues {
      background: var(--warning-bg);
      border-left: 4px solid var(--warning-border);
      padding: 12px;
      border-radius: 4px;
      margin: 10px 0;
    }
    .safety-issues.error { border-left-color: var(--error-color); }
    .safety-issues ul { margin: 5px 0; padding-left: 20
