<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload para GitHub</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; background: #fafafa; }
    .nav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    .nav a { text-decoration: none; color: #0366d6; font-weight: 600; }
    .nav a.active { color: #000; border-bottom: 3px solid #0366d6; padding-bottom: 8px; }
    textarea { width: 100%; height: 400px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { padding: 12px 24px; background: #2ea44f; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #22863a; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin: 15px 0; font-weight: bold; }
    .success { color: #22863a; }
    .error { color: #d73a4a; }
    .details { background: #f6f8fa; padding: 15px; border-radius: 6px; margin-top: 10px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; overflow-x: auto; }
    .info-box { background: #e1f0fa; border-left: 4px solid #0366d6; padding: 12px; border-radius: 4px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="nav">
    <a href="/index.html">📥 Download (Concatenar)</a>
    <a href="/upload.html" class="active">📤 Upload (Atualizar Repo)</a>
  </div>

  <h1>📤 Atualizar Repositório GitHub</h1>
  <div class="info-box">
    Cole abaixo o texto gerado pela ferramenta de download (com os cabeçalhos <code>// ===== ARQUIVO: ...</code>).<br>
    Todos os ficheiros serão criados ou atualizados no repositório configurado.
  </div>

  <textarea id="inputText" placeholder="Cole aqui o texto do repo-concatenator..."></textarea>
  <br><br>
  <button id="updateBtn" onclick="updateRepo()">📤 Enviar para o GitHub</button>
  <div id="status"></div>
  <div id="details" class="details" style="display:none;"></div>

  <script>
    async function updateRepo() {
      const text = document.getElementById('inputText').value.trim();
      const status = document.getElementById('status');
      const details = document.getElementById('details');
      const btn = document.getElementById('updateBtn');

      if (!text) {
        status.innerHTML = '<span class="error">⚠️ Por favor, cole o texto.</span>';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ A enviar...';
      status.innerHTML = '⏳ A processar...';
      details.style.display = 'none';

      try {
        const response = await fetch('/api/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro desconhecido');
        }

        status.innerHTML = `<span class="success">✅ ${data.message}</span>`;
        if (data.details) {
          details.style.display = 'block';
          details.textContent = JSON.stringify(data.details, null, 2);
        }
      } catch (err) {
        status.innerHTML = `<span class="error">❌ Erro: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '📤 Enviar para o GitHub';
      }
    }
  </script>

</body>
</html>
