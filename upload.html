<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repo AI - Proposta</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css">
  <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html-ui.min.js"></script>
  <style>
    :root {
      --bg: #fafafa; --text: #1e1e1e; --border: #ccc; --input-bg: #fff;
      --btn-bg: #2ea44f; --btn-hover: #22863a; --btn-danger: #d73a4a; --btn-secondary: #586069;
      --nav-link: #0366d6; --nav-active: #000; --status-color: #22863a; --error-color: #d73a4a;
      --info-bg: #e1f0fa; --info-border: #0366d6; --details-bg: #f6f8fa; --ai-bg: #e8f0fe;
      --ai-border: #1a73e8; --warning-bg: #fff5b1; --warning-border: #ffd700;
    }
    body.dark {
      --bg: #1e1e1e; --text: #e0e0e0; --border: #444; --input-bg: #2d2d2d;
      --btn-bg: #2ea44f; --btn-hover: #22863a; --btn-danger: #f85149; --btn-secondary: #8b949e;
      --nav-link: #58a6ff; --nav-active: #fff; --status-color: #4caf50; --error-color: #f85149;
      --info-bg: #1e2a3a; --info-border: #58a6ff; --details-bg: #2d2d2d; --ai-bg: #1e2a3a;
      --ai-border: #58a6ff; --warning-bg: #3d3a1a; --warning-border: #ffd700;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1200px; margin: 30px auto; padding: 0 20px; background-color: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    .nav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .nav a { text-decoration: none; color: var(--nav-link); font-weight: 600; }
    .nav a.active { color: var(--nav-active); border-bottom: 3px solid var(--nav-link); padding-bottom: 8px; }
    .theme-toggle { position: fixed; top: 20px; right: 20px; background: var(--border); border: none; border-radius: 30px; padding: 8px 16px; font-size: 1.2rem; cursor: pointer; color: var(--text); z-index: 1000; }
    .theme-toggle:hover { background: var(--nav-link); color: #fff; }
    textarea, input, select { width: 100%; padding: 10px; background-color: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    textarea { height: 120px; font-family: monospace; resize: vertical; }
    button { padding: 10px 20px; cursor: pointer; background-color: var(--btn-bg); color: #fff; border: none; border-radius: 6px; font-size: 1rem; transition: background 0.3s; }
    button:hover { background-color: var(--btn-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-danger { background-color: var(--btn-danger); }
    .btn-danger:hover { background-color: var(--btn-danger-hover); }
    .btn-secondary { background-color: var(--btn-secondary); }
    .btn-secondary:hover { background-color: var(--btn-secondary-hover); }

    .form-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .form-group .field { flex: 1; min-width: 150px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 4px; }

    .ai-container { background: var(--ai-bg); border: 1px solid var(--ai-border); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
    .ai-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .ai-row input { flex: 2; min-width: 200px; }
    .ai-row select { flex: 1; min-width: 120px; }
    .ai-row button { flex: 0; background: #1a73e8; }
    .ai-row button:hover { background: #1557b0; }

    .proposal-area { margin-top: 20px; border: 2px solid var(--ai-border); border-radius: 8px; padding: 20px; background: var(--input-bg); display: none; }
    .proposal-area.visible { display: block; }

    .diff-container { background: var(--details-bg); border-radius: 6px; padding: 10px; margin: 10px 0; max-height: 500px; overflow-y: auto; }
    .diff-container .d2h-wrapper { font-size: 0.85rem; }

    .safety-issues { background: var(--warning-bg); border-left: 4px solid var(--warning-border); padding: 12px; border-radius: 4px; margin: 10px 0; }
    .safety-issues.error { border-left-color: var(--error-color); }
    .safety-issues ul { margin: 5px 0; padding-left: 20px; }

    .summary-box { display: flex; gap: 20px; flex-wrap: wrap; background: var(--details-bg); padding: 15px; border-radius: 6px; margin: 10px 0; }
    .summary-box .stat { display: flex; align-items: center; gap: 8px; }
    .badge { padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    .badge-success { background: #2ea44f; color: #fff; }
    .badge-danger { background: #d73a4a; color: #fff; }
    .badge-warning { background: #ffd700; color: #000; }

    .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }

    #status, #aiStatus { margin: 10px 0; font-weight: bold; }
    .error { color: var(--error-color); }
    .success { color: var(--status-color); }

    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--btn-bg); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <div class="nav">
    <a href="/index.html">📥 Download</a>
    <a href="/upload.html" class="active">🤖 AI Proposta</a>
  </div>

  <h1>🤖 Gerar Proposta com IA</h1>

  <div class="form-group">
    <div class="field"><label>👤 Dono</label><input type="text" id="repoOwner" placeholder="ex: joaosilva"></div>
    <div class="field"><label>📁 Repositório</label><input type="text" id="repoName" placeholder="ex: meu-projeto"></div>
    <div class="field"><label>🌿 Branch</label><input type="text" id="repoBranch" value="main"></div>
  </div>

  <div class="ai-container">
    <div class="ai-row">
      <input type="text" id="aiRepoUrl" placeholder="https://github.com/usuario/repo/tree/main">
      <select id="modelSelect">
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;"><input type="checkbox" id="dryRunCheck" checked> 🧪 Dry Run</label>
      <button onclick="gerarProposta()" id="proposalBtn">🧠 Gerar Proposta</button>
    </div>
    <textarea id="aiPrompt" rows="3" placeholder="Ex: Melhora o sistema de tickets, adiciona validação de entrada e logs de erro."></textarea>
    <div id="aiStatus"></div>
  </div>

  <div id="proposalArea" class="proposal-area">
    <h3>📋 Proposta Gerada</h3>
    <div id="proposalSummary"></div>
    <div id="safetyIssues"></div>
    <h4>📝 Diff das alterações:</h4>
    <div id="diffContainer" class="diff-container"></div>
    <div class="action-buttons">
      <button onclick="aplicarProposta()" id="applyBtn" class="btn-success">✅ Aplicar no GitHub</button>
      <button onclick="rejeitarProposta()" class="btn-danger">❌ Rejeitar</button>
      <button onclick="copiarDiff()" class="btn-secondary">📋 Copiar Diff</button>
    </div>
    <div id="applyStatus"></div>
  </div>

  <details style="margin-top:20px;">
    <summary>💬 Resposta bruta da IA</summary>
    <textarea id="rawAIResponse" rows="6" readonly style="margin-top:10px;"></textarea>
  </details>

  <script>
    (function() {
      const toggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('theme') || 'light';
      document.body.classList.toggle('dark', currentTheme === 'dark');
      toggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', function() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        toggle.textContent = isDark ? '☀️' : '🌙';
      });
    })();

    let currentProposal = null;

    async function gerarProposta() {
      const repoUrl = document.getElementById('aiRepoUrl').value.trim();
      const prompt = document.getElementById('aiPrompt').value.trim();
      const owner = document.getElementById('repoOwner').value.trim();
      const repo = document.getElementById('repoName').value.trim();
      const branch = document.getElementById('repoBranch').value.trim() || 'main';
      const model = document.getElementById('modelSelect').value;
      const dryRun = document.getElementById('dryRunCheck').checked;

      const status = document.getElementById('aiStatus');
      const btn = document.getElementById('proposalBtn');
      const proposalArea = document.getElementById('proposalArea');
      const rawOutput = document.getElementById('rawAIResponse');

      if (!repoUrl || !prompt) {
        status.innerHTML = '<span class="error">⚠️ Preenche o URL e a instrução.</span>';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> A gerar...';
      status.innerHTML = '⏳ A IA está a analisar...';
      proposalArea.classList.remove('visible');
      rawOutput.value = '';

      try {
        const response = await fetch('/api/proposal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoUrl, prompt, owner, repo, branch, model, dryRun })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Erro desconhecido');

        currentProposal = data;
        rawOutput.value = data.aiOutput || '';
        proposalArea.classList.add('visible');

        const summary = document.getElementById('proposalSummary');
        summary.innerHTML = `
          <div class="summary-box">
            <div class="stat">📌 <strong>${data.objective || 'Melhoria'}</strong></div>
            <div class="stat">📄 <strong>${data.summary.totalFiles}</strong> ficheiros</div>
            <div class="stat">➕ <strong>${data.summary.newFiles}</strong> novos</div>
            <div class="stat">✏️ <strong>${data.summary.modifiedFiles}</strong> modificados</div>
            <div class="stat">
              <span class="badge ${data.summary.hasErrors ? 'badge-danger' : 'badge-success'}">
                ${data.summary.hasErrors ? '⚠️ Erros' : '✅ Safety OK'}
              </span>
            </div>
          </div>
        `;

        const safetyDiv = document.getElementById('safetyIssues');
        if (data.safety.errors.length > 0 || data.safety.warnings.length > 0) {
          let html = '<div class="safety-issues error"><strong>🛡️ Problemas de segurança:</strong><ul>';
          for (const err of data.safety.errors) {
            html += `<li>🔴 <strong>${err.file}</strong>: ${err.message}</li>`;
          }
          for (const warn of data.safety.warnings) {
            html += `<li>🟡 <strong>${warn.file}</strong>: ${warn.message}</li>`;
          }
          html += '</ul></div>';
          safetyDiv.innerHTML = html;
        } else {
          safetyDiv.innerHTML = '<div class="safety-issues" style="border-left-color:#2ea44f;">✅ Nenhum problema de segurança detetado.</div>';
        }

        renderDiffs(data.files);
        status.innerHTML = `<span class="success">✅ Proposta gerada! (${data.files.length} ficheiros)</span>`;
        document.getElementById('applyStatus').innerHTML = '';

        if (dryRun) {
          document.getElementById('applyBtn').disabled = true;
          document.getElementById('applyBtn').textContent = '🧪 Modo Dry Run – sem commit';
        } else {
          document.getElementById('applyBtn').disabled = false;
          document.getElementById('applyBtn').textContent = '✅ Aplicar no GitHub';
        }

      } catch (err) {
        status.innerHTML = `<span class="error">❌ Erro: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🧠 Gerar Proposta';
      }
    }

    function renderDiffs(files) {
      const container = document.getElementById('diffContainer');
      if (!files || files.length === 0) {
        container.innerHTML = '<p>Nenhum ficheiro alterado.</p>';
        return;
      }
      let html = '';
      for (const file of files) {
        const isNew = file.isNew ? ' (novo)' : ' (modificado)';
        html += `<h5 style="margin:10px 0 5px 0;">📄 ${file.path} ${isNew}</h5>`;
        html += `<div class="diff-wrapper" data-diff="${encodeURIComponent(file.diff)}"></div>`;
      }
      container.innerHTML = html;

      const wrappers = container.querySelectorAll('.diff-wrapper');
      for (const wrapper of wrappers) {
        const diffText = decodeURIComponent(wrapper.dataset.diff);
        try {
          const diffHtml = Diff2Html.html(diffText, {
            drawFileList: false,
            matching: 'lines',
            outputFormat: 'side-by-side'
          });
          wrapper.innerHTML = diffHtml;
        } catch (e) {
          wrapper.innerHTML = `<pre style="white-space:pre-wrap;font-size:0.8rem;">${diffText}</pre>`;
        }
      }
    }

    async function aplicarProposta() {
      if (!currentProposal) { alert('Nenhuma proposta para aplicar.'); return; }
      const dryRun = document.getElementById('dryRunCheck').checked;
      if (dryRun) { alert('Esta proposta está em modo Dry Run. Desmarque a opção para aplicar.'); return; }

      const owner = document.getElementById('repoOwner').value.trim();
      const repo = document.getElementById('repoName').value.trim();
      const branch = document.getElementById('repoBranch').value.trim() || 'main';

      if (!owner || !repo) { alert('Preenche Dono e Repositório.'); return; }

      const btn = document.getElementById('applyBtn');
      const status = document.getElementById('applyStatus');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> A aplicar...';
      status.innerHTML = '⏳ A enviar...';

      try {
        const filesToApply = currentProposal.files.map(f => ({
          path: f.path,
          newContent: f.newContent
        }));

        const response = await fetch('/api/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            files: filesToApply,
            owner, repo, branch,
            commitMessage: `🤖 ${currentProposal.objective || 'Melhoria via IA'}`
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Erro ao aplicar');

        status.innerHTML = `<span class="success">✅ ${data.message}</span>`;
        btn.disabled = true;
        btn.textContent = '✅ Aplicado';

      } catch (err) {
        status.innerHTML = `<span class="error">❌ Erro: ${err.message}</span>`;
        btn.disabled = false;
        btn.innerHTML = '✅ Aplicar no GitHub';
      }
    }

    function rejeitarProposta() {
      if (!confirm('Rejeitar proposta?')) return;
      currentProposal = null;
      document.getElementById('proposalArea').classList.remove('visible');
      document.getElementById('aiStatus').innerHTML = '📋 Proposta rejeitada.';
      document.getElementById('applyStatus').innerHTML = '';
    }

    function copiarDiff() {
      const container = document.getElementById('diffContainer');
      const text = container.innerText || container.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => alert('Diff copiado!')).catch(() => alert('Não foi possível copiar.'));
    }
  </script>
</body>
</html>
